name: Sync FPL data

on:
  push:
    paths:
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest league data
        run: |
          curl --fail --silent --show-error --retry 3 https://kiwi-hjemseng-fpl.onrender.com/league -o latest.tmp.json

      - name: Check for substantive changes
        id: changes
        shell: bash
        run: |
          if [ -f latest.json ]; then
            jq 'del(.generated_at)' latest.json > old.norm.json
            jq 'del(.generated_at)' latest.tmp.json > new.norm.json
            if cmp -s old.norm.json new.norm.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          mv latest.tmp.json latest.json
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update FPL league data"
          git push
